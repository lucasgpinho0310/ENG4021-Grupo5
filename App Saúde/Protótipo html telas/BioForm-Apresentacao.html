var P={"00-abertura.html": "<!DOCTYPE html>\n<html lang=\"pt-BR\">\n<head>\n  <meta charset=\"UTF-8\">\n  <meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n  <title>BioForm Health OS<\/title>\n  <link rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n  <link rel=\"preconnect\" href=\"https://fonts.gstatic.com\" crossorigin>\n  <link href=\"https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap\" rel=\"stylesheet\">\n  <style>/* ==========================================================================\n   BioForm Health OS — estilo compartilhado da apresentação (módulos 01 a 06)\n   ========================================================================== */\n\n:root {\n  --stage: #09090B;\n  --app-bg: #111113;\n  --surface: #1A1A1D;\n  --surface-2: #232327;\n  --line: rgba(255, 255, 255, 0.08);\n  --line-strong: rgba(255, 255, 255, 0.16);\n\n  --text: #FAFAFA;\n  --text-2: #A1A1AA;\n  --text-3: #8A8A93;\n\n  --flame: #FF5722;\n  --flame-soft: rgba(255, 87, 34, 0.12);\n  --flame-line: rgba(255, 87, 34, 0.55);\n  --green: #10B981;\n  --green-soft: rgba(16, 185, 129, 0.12);\n  --violet: #8B5CF6;\n  --violet-soft: rgba(139, 92, 246, 0.14);\n  --water: #38BDF8;\n  --water-soft: rgba(56, 189, 248, 0.12);\n\n  --font: 'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif;\n}\n\n* { box-sizing: border-box; margin: 0; padding: 0; }\n\nbody {\n  background: var(--stage);\n  color: var(--text);\n  font-family: var(--font);\n  -webkit-font-smoothing: antialiased;\n  padding: 20px 20px 48px;\n  display: flex;\n  flex-direction: column;\n  align-items: center;\n}\n\n/* ---------- Barra de navegação da apresentação ---------- */\n.deck-nav-bar {\n  width: 100%;\n  max-width: 1180px;\n  display: flex;\n  justify-content: space-between;\n  align-items: center;\n  flex-wrap: wrap;\n  gap: 10px;\n  padding: 10px 14px;\n  margin-bottom: 32px;\n  background: var(--surface);\n  border: 1px solid var(--line);\n  border-radius: 14px;\n}\n.deck-nav-left { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }\n.deck-modules-pills { display: flex; gap: 2px; flex-wrap: wrap; }\n.nav-btn-hub, .mod-pill-link, .arrow-btn {\n  display: inline-flex;\n  align-items: center;\n  gap: 6px;\n  font-size: 13px;\n  text-decoration: none;\n  border-radius: 8px;\n  padding: 6px 10px;\n}\n.nav-btn-hub { color: var(--text); font-weight: 600; background: var(--surface-2); }\n.mod-pill-link { color: var(--text-2); }\n.mod-pill-link:hover { color: var(--text); }\n.mod-pill-link.active { color: var(--text); background: var(--surface-2); font-weight: 600; }\n.nav-arrows { display: flex; gap: 6px; }\n.arrow-btn { font-weight: 600; color: var(--text); background: var(--surface-2); }\n.arrow-btn.primary { background: var(--flame); color: #fff; }\n\n/* ---------- Cabeçalho do módulo ---------- */\n.header-section { text-align: center; max-width: 820px; margin-bottom: 36px; }\n.badge-module {\n  display: inline-block;\n  font-size: 12px;\n  font-weight: 600;\n  letter-spacing: .06em;\n  text-transform: uppercase;\n  color: var(--flame);\n  margin-bottom: 12px;\n}\n.header-section h1 { font-size: 30px; line-height: 1.2; font-weight: 700; letter-spacing: -.02em; margin-bottom: 10px; }\n.header-section p { font-size: 15px; line-height: 1.6; color: var(--text-2); }\n.header-section p strong { color: var(--text); font-weight: 600; }\n\n/* ---------- Grade de telas ---------- */\n.frames-container { display: flex; flex-wrap: wrap; justify-content: center; gap: 40px 32px; }\n.frame-title { text-align: center; font-size: 14px; font-weight: 600; margin-bottom: 18px; }\n.frame-title span { color: var(--flame); margin-right: 4px; }\n\n/* ---------- Moldura do web app ---------- */\n.webapp-frame {\n  width: 340px;\n  height: 720px;\n  border-radius: 40px;\n  background: var(--app-bg);\n  box-shadow: 0 0 0 8px #1C1C1F, 0 0 0 9px #303036, 0 32px 70px -20px rgba(0, 0, 0, .85);\n  margin: 9px;\n  overflow: hidden;\n  display: flex;\n  flex-direction: column;\n  font-size: 13px;\n}\n.url-bar {\n  flex-shrink: 0;\n  margin: 14px 16px 4px;\n  height: 30px;\n  border-radius: 10px;\n  background: var(--surface);\n  display: flex;\n  align-items: center;\n  justify-content: center;\n  gap: 6px;\n  font-size: 12px;\n  color: var(--text-3);\n}\n.url-bar strong { color: var(--text-2); font-weight: 500; }\n.url-bar .i { width: 12px; height: 12px; }\n\n.progress { height: 4px; margin: 12px 16px 0; border-radius: 99px; background: var(--surface-2); overflow: hidden; flex-shrink: 0; }\n.progress > span { display: block; height: 100%; background: var(--flame); border-radius: inherit; }\n\n.webapp-content {\n  flex: 1;\n  min-height: 0;\n  display: flex;\n  flex-direction: column;\n  gap: 12px;\n  padding: 14px 16px 22px;\n}\n\n.step-label { font-size: 11px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--flame); margin-bottom: 4px; }\n.step-label.green { color: var(--green); }\n.screen-title { font-size: 20px; line-height: 1.2; font-weight: 700; letter-spacing: -.02em; }\n.screen-sub { font-size: 13px; line-height: 1.45; color: var(--text-2); margin-top: 6px; }\n.screen-sub strong { color: var(--text); font-weight: 600; }\n\n/* ---------- Ícones ---------- */\n.i { width: 16px; height: 16px; flex-shrink: 0; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }\n\n/* ---------- Campos ---------- */\n.fields { display: flex; flex-direction: column; gap: 10px; }\n.field > label, .label { display: block; font-size: 12px; font-weight: 500; color: var(--text-2); margin-bottom: 6px; }\n.input {\n  height: 42px;\n  display: flex;\n  align-items: center;\n  gap: 10px;\n  padding: 0 12px;\n  border-radius: 12px;\n  background: var(--surface);\n  border: 1px solid var(--line);\n  font-size: 14px;\n}\n.input > .i { color: var(--text-3); }\n.input .value { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-variant-numeric: tabular-nums; }\n.input .trail { display: flex; align-items: center; gap: 4px; font-size: 12px; font-weight: 500; color: var(--green); white-space: nowrap; }\n\n/* ---------- Botões ---------- */\n.btn {\n  height: 48px;\n  flex-shrink: 0;\n  display: flex;\n  align-items: center;\n  justify-content: center;\n  gap: 8px;\n  border-radius: 14px;\n  font-size: 14px;\n  font-weight: 600;\n  color: #fff;\n  margin-top: auto;\n}\n.btn-primary { background: var(--flame); }\n.btn-success { background: var(--green); }\n\n/* ---------- Cards e seleção ---------- */\n.card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 12px; }\n.row { display: flex; align-items: center; justify-content: space-between; gap: 10px; }\n.num { font-size: 20px; font-weight: 700; letter-spacing: -.02em; font-variant-numeric: tabular-nums; }\n.unit { font-size: 12px; font-weight: 500; color: var(--text-3); margin-left: 2px; letter-spacing: 0; }\n\n.segmented { display: flex; gap: 4px; }\n.seg {\n  flex: 1;\n  min-width: 0;\n  height: 34px;\n  display: grid;\n  place-items: center;\n  border-radius: 9px;\n  background: var(--surface-2);\n  border: 1px solid transparent;\n  font-size: 12px;\n  font-weight: 500;\n  color: var(--text-2);\n}\n.seg small { display: block; font-size: 10px; color: var(--text-3); font-weight: 400; margin-top: 1px; }\n.seg.tall { height: 46px; text-align: center; line-height: 1.2; }\n.seg.is-selected { background: var(--flame-soft); border-color: var(--flame-line); color: var(--text); font-weight: 600; }\n.seg.is-selected small { color: var(--flame); }\n\n.options { display: flex; flex-direction: column; gap: 6px; }\n.option {\n  display: flex;\n  align-items: center;\n  gap: 10px;\n  padding: 9px 12px;\n  border-radius: 12px;\n  background: var(--surface-2);\n  border: 1px solid transparent;\n}\n.opt-title { font-size: 13px; font-weight: 600; }\n.opt-desc { font-size: 11px; color: var(--text-2); margin-top: 2px; line-height: 1.35; }\n.opt-meta { margin-left: auto; font-size: 11px; font-weight: 600; color: var(--text-3); white-space: nowrap; }\n.option.is-selected { background: var(--flame-soft); border-color: var(--flame-line); }\n.option.is-selected .opt-meta { color: var(--flame); }\n\n.chips { display: flex; flex-wrap: wrap; gap: 6px; }\n.chip {\n  display: inline-flex;\n  align-items: center;\n  gap: 5px;\n  height: 30px;\n  padding: 0 10px;\n  border-radius: 99px;\n  background: var(--surface-2);\n  font-size: 12px;\n  font-weight: 500;\n  color: var(--text-2);\n}\n.chip.is-selected { background: var(--flame-soft); color: var(--text); box-shadow: inset 0 0 0 1px var(--flame-line); }\n.chip .i { width: 14px; height: 14px; }\n\n.c-flame { color: var(--flame); }\n.c-green { color: var(--green); }\n.c-violet { color: var(--violet); }\n.c-water { color: var(--water); }\n.c-muted { color: var(--text-2); }\n\n/* ---------- Cabeçalho interno do app (voltar + caminho) ---------- */\n.app-top {\n  flex-shrink: 0;\n  display: flex;\n  align-items: center;\n  gap: 10px;\n  padding: 12px 16px 0;\n  font-size: 12px;\n  color: var(--text-3);\n}\n.app-top .back {\n  width: 30px;\n  height: 30px;\n  border-radius: 10px;\n  background: var(--surface);\n  display: grid;\n  place-items: center;\n  color: var(--text);\n  flex-shrink: 0;\n}\n.app-top strong { color: var(--text-2); font-weight: 500; }\n\n/* ---------- Barra de abas inferior ---------- */\n.tabbar {\n  flex-shrink: 0;\n  display: flex;\n  justify-content: space-around;\n  padding: 10px 8px 18px;\n  border-top: 1px solid var(--line);\n}\n.tab { display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 10px; font-weight: 500; color: var(--text-3); }\n.tab .i { width: 20px; height: 20px; }\n.tab.active { color: var(--flame); }\n\n/* ---------- Indicador de toque (onde o usuário toca para ir à próxima tela) ---------- */\n.tap { position: relative; }\n.tap-dot {\n  position: absolute;\n  z-index: 2;\n  width: 26px;\n  height: 26px;\n  margin: -13px 0 0 -13px;\n  border-radius: 99px;\n  background: rgba(255, 255, 255, .22);\n  border: 2px solid rgba(255, 255, 255, .75);\n  pointer-events: none;\n}\n.tap-dot::after {\n  content: \"\";\n  position: absolute;\n  inset: -8px;\n  border-radius: inherit;\n  border: 2px solid rgba(255, 255, 255, .35);\n  animation: tap-pulse 1.8s ease-out infinite;\n}\n@keyframes tap-pulse {\n  from { transform: scale(.6); opacity: 1; }\n  to   { transform: scale(1.4); opacity: 0; }\n}\n\n/* ---------- Interruptor ---------- */\n.switch { width: 40px; height: 24px; border-radius: 99px; background: var(--surface-2); position: relative; flex-shrink: 0; }\n.switch::after { content: \"\"; position: absolute; top: 3px; left: 3px; width: 18px; height: 18px; border-radius: 99px; background: var(--text-3); }\n.switch.on { background: var(--flame); }\n.switch.on::after { left: 19px; background: #fff; }\n\n/* ---------- Botões secundários ---------- */\n.btn-dashed {\n  height: 44px;\n  flex-shrink: 0;\n  display: flex;\n  align-items: center;\n  justify-content: center;\n  gap: 8px;\n  border-radius: 12px;\n  border: 1.5px dashed var(--line-strong);\n  font-size: 13px;\n  font-weight: 600;\n  color: var(--text-2);\n}\n.btn-outline {\n  height: 36px;\n  flex: 1;\n  display: flex;\n  align-items: center;\n  justify-content: center;\n  gap: 6px;\n  border-radius: 10px;\n  background: var(--surface-2);\n  font-size: 13px;\n  font-weight: 600;\n}\n.btn-outline.primary { background: var(--flame); color: #fff; }\n\n/* ---------- Estado de campo em digitação ---------- */\n.input.is-focus { border-color: var(--flame); box-shadow: 0 0 0 3px var(--flame-soft); }\n.input.is-focus .value::after {\n  content: \"\";\n  display: inline-block;\n  width: 1.5px;\n  height: 15px;\n  margin-left: 2px;\n  vertical-align: -3px;\n  background: var(--flame);\n  animation: caret 1s steps(1) infinite;\n}\n@keyframes caret { 50% { opacity: 0; } }\n\n/* ---------- Hierarquia de botões ----------\n   .btn-primary   → 1 por tela: avança ou conclui o fluxo (sempre embaixo)\n   .btn-secondary → ação que continua na mesma tela (adicionar outro item, criar outro)\n   ------------------------------------------ */\n.btn-secondary {\n  height: 44px;\n  flex-shrink: 0;\n  display: flex;\n  align-items: center;\n  justify-content: center;\n  gap: 8px;\n  border-radius: 12px;\n  background: var(--surface);\n  border: 1px solid var(--line-strong);\n  font-size: 13px;\n  font-weight: 600;\n  color: var(--text);\n}\n\n/* ---------- Botão central \"+\" da barra de abas (registrar: check-in / refeição) ---------- */\n.tab-plus {\n  position: relative;\n  z-index: 6;\n  width: 48px;\n  height: 48px;\n  margin-top: -20px;\n  border-radius: 16px;\n  background: var(--flame);\n  color: #fff;\n  display: grid;\n  place-items: center;\n  box-shadow: 0 0 0 5px var(--app-bg);\n  flex-shrink: 0;\n}\n.tab-plus .i { width: 22px; height: 22px; stroke-width: 2.4; }\n.tab-plus.open { background: var(--surface-2); }\n\n/* ---------- Botão flutuante \"+\" (registros rápidos) ----------\n   Fica acima da barra de abas, no canto inferior direito, ao alcance do polegar.\n   Não aparece em telas que já têm um botão principal no rodapé. */\n.webapp-frame { position: relative; }\n.fab {\n  position: absolute;\n  right: 16px;\n  bottom: 84px;\n  z-index: 6;\n  width: 52px;\n  height: 52px;\n  border-radius: 18px;\n  background: var(--flame);\n  color: #fff;\n  display: grid;\n  place-items: center;\n  box-shadow: 0 12px 24px -8px rgba(255, 87, 34, .6), 0 0 0 4px var(--app-bg);\n}\n.fab .i { width: 22px; height: 22px; stroke-width: 2.4; }\n.fab.open { background: var(--surface-2); box-shadow: 0 0 0 4px var(--app-bg); }\n.has-fab .webapp-content { padding-bottom: 46px; }\n\n.url-bar .bf-fav { width: 14px; height: 14px; flex-shrink: 0; border-radius: 4px; }\n\n.deck-footer-nav { max-width: 1400px; margin: 40px auto 24px; padding: 14px 18px; display: flex; justify-content: center; border-top: 1px solid var(--line); }\n.deck-footer-nav .nav-arrows { gap: 12px; }\n\n/* Avisos de saúde */\n.health-note { display: flex; gap: 8px; align-items: flex-start; font-size: 10.5px; line-height: 1.45; color: var(--text-3); padding: 8px 10px; border-radius: 10px; background: var(--surface); border: 1px solid var(--line); }\n.health-note .i { width: 14px; height: 14px; flex-shrink: 0; margin-top: 1px; color: var(--text-2); }\n.health-note .lnk { color: var(--flame); font-weight: 600; white-space: nowrap; }\n.sug-note { margin-top: 10px; padding-top: 8px; border-top: 1px solid var(--line); font-size: 10.5px; line-height: 1.4; color: var(--text-3); }\n.consent { display: flex; gap: 8px; align-items: flex-start; font-size: 11px; line-height: 1.45; color: var(--text-2); }\n.consent b { color: var(--flame); font-weight: 600; }\n.consent .box { width: 16px; height: 16px; border-radius: 5px; background: var(--flame); color: #fff; display: grid; place-items: center; flex-shrink: 0; margin-top: 1px; }\n.consent .box .i { width: 11px; height: 11px; stroke-width: 3; }\n<\/style>\n  <style>\n    body { min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 48px 24px; background: radial-gradient(900px 520px at 50% 18%, rgba(255,87,34,.16), transparent 70%), var(--bg, #0B0B0D); }\n    .splash { display: flex; flex-direction: column; align-items: center; text-align: center; gap: 18px; }\n    .logo { width: 112px; height: 112px; filter: drop-shadow(0 18px 40px rgba(255,87,34,.45)); }\n    .brand { font-size: 44px; font-weight: 800; letter-spacing: -.03em; line-height: 1; }\n    .brand span { color: var(--flame); }\n    .brand small { display: block; margin-top: 8px; font-size: 13px; font-weight: 600; letter-spacing: .32em; color: var(--text-3); text-transform: uppercase; }\n    .slogan { font-size: 18px; color: var(--text-2); font-weight: 500; }\n    .slogan b { color: var(--text); font-weight: 700; }\n    .pick-title { margin: 44px 0 14px; font-size: 12px; font-weight: 700; letter-spacing: .18em; text-transform: uppercase; color: var(--text-3); }\n    .pick { display: grid; grid-template-columns: repeat(4, minmax(0, 190px)); gap: 10px; }\n    .pick a { display: flex; flex-direction: column; gap: 6px; padding: 14px 16px; border-radius: 14px; background: var(--surface); border: 1px solid var(--line); color: var(--text); text-decoration: none; text-align: left; transition: border-color .15s, transform .15s; }\n    .pick a:hover { border-color: var(--flame); transform: translateY(-2px); }\n    .pick a em { font-style: normal; font-size: 12px; font-weight: 700; color: var(--flame); }\n    .pick a strong { font-size: 14px; font-weight: 600; }\n    @media (max-width: 860px) { .pick { grid-template-columns: repeat(2, minmax(0, 1fr)); } }\n  <\/style>\n<\/head>\n<body>\n  <div class=\"splash\">\n    <svg class=\"logo\" viewBox=\"0 0 120 120\" fill=\"none\">\n      <defs>\n        <linearGradient id=\"g\" x1=\"0\" y1=\"0\" x2=\"1\" y2=\"1\"><stop offset=\"0\" stop-color=\"#FF8A50\"/><stop offset=\"1\" stop-color=\"#FF3D00\"/><\/linearGradient>\n      <\/defs>\n      <rect x=\"4\" y=\"4\" width=\"112\" height=\"112\" rx=\"32\" fill=\"url(#g)\"/>\n      <path d=\"M60 26a34 34 0 1 1-30.6 19.2\" stroke=\"#fff\" stroke-width=\"9\" stroke-linecap=\"round\" opacity=\".95\"/>\n      <path d=\"M29.4 45.2 24 30l15.6 4.2\" stroke=\"#fff\" stroke-width=\"9\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/>\n      <path d=\"M44 72l11-14 9 9 13-19\" stroke=\"#fff\" stroke-width=\"8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/>\n    <\/svg>\n    <div class=\"brand\">Bio<span>Form<\/span><small>Health OS<\/small><\/div>\n    <div class=\"slogan\">Seu treino, sua dieta, seu ciclo, <b>seu ritmo<\/b><\/div>\n  <\/div>\n\n  <div class=\"pick-title\">Por onde você quer começar?<\/div>\n  <div class=\"pick\">\n    <a href=\"01-cadastro-login-perfil.html\"><em>01<\/em><stro \n\n  --text: #FAFAFA;\n  --text-2: #A1A1AA;\n  --text-3: #8A8A93;\n\n  --flame: #FF5722;\n  --flame-soft: rgba(255, 87, 34, 0.12);\n  --flame-line: rgba(255, 87, 34, 0.55);\n  --green: #10B981;\n  --green-soft: rgba(16, 185, 129, 0.12);\n  --violet: #8B5CF6;\n  --violet-soft: rgba(139, 92, 246, 0.14);\n  --water: #38BDF8;\n  --water-soft: rgba(56, 189, 248, 0.12);\n\n  --font: 'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif;\n}\n\n* { box-sizing: border-box; margin: 0; padding: 0; }\n\nbody {\n  background: var(--stage);\n  color: var(--text);\n  font-family: var(--font);\n  -webkit-font-smoothing: antialiased;\n  padding: 20px 20px 48px;\n  display: flex;\n  flex-direction: column;\n  align-items: center;\n}\n\n/* ---------- Barra de navegação da apresentação ---------- */\n.deck-nav-bar {\n  width: 100%;\n  max-width: 1180px;\n  display: flex;\n  justify-content: space-between;\n  align-items: center;\n  flex-wrap: wrap;\n  gap: 10px;\n  padding: 10px 14px;\n  margin-bottom: 32px;\n  background: var(--surface);\n  border: 1px solid var(--line);\n  border-radius: 14px;\n}\n.deck-nav-left { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }\n.deck-modules-pills { display: flex; gap: 2px; flex-wrap: wrap; }\n.nav-btn-hub, .mod-pill-link, .arrow-btn {\n  display: inline-flex;\n  align-items: center;\n  gap: 6px;\n  font-size: 13px;\n  text-decoration: none;\n  border-radius: 8px;\n  padding: 6px 10px;\n}\n.nav-btn-hub { color: var(--text); font-weight: 600; background: var(--surface-2); }\n.mod-pill-link { color: var(--text-2); }\n.mod-pill-link:hover { color: var(--text); }\n.mod-pill-link.active { color: var(--text); background: var(--surface-2); font-weight: 600; }\n.nav-arrows { display: flex; gap: 6px; }\n.arrow-btn { font-weight: 600; color: var(--text); background: var(--surface-2); }\n.arrow-btn.primary { background: var(--flame); color: #fff; }\n\n/* ---------- Cabeçalho do módulo ---------- */\n.header-section { text-align: center; max-width: 820px; margin-bottom: 36px; }\n.badge-module {\n  display: inline-block;\n  font-size: 12px;\n  font-weight: 600;\n  letter-spacing: .06em;\n  text-transform: uppercase;\n  color: var(--flame);\n  margin-bottom: 12px;\n}\n.header-section h1 { font-size: 30px; line-height: 1.2; font-weight: 700; letter-spacing: -.02em; margin-bottom: 10px; }\n.header-section p { font-size: 15px; line-height: 1.6; color: var(--text-2); }\n.header-section p strong { color: var(--text); font-weight: 600; }\n\n/* ---------- Grade de telas ---------- */\n.frames-container { display: flex; flex-wrap: wrap; justify-content: center; gap: 40px 32px; }\n.frame-title { text-align: center; font-size: 14px; font-weight: 600; margin-bottom: 18px; }\n.frame-title span { color: var(--flame); margin-right: 4px; }\n\n/* ---------- Moldura do web app ---------- */\n.webapp-frame {\n  width: 340px;\n  height: 720px;\n  border-radius: 40px;\n  background: var(--app-bg);\n  box-shadow: 0 0 0 8px #1C1C1F, 0 0 0 9px #303036, 0 32px 70px -20px rgba(0, 0, 0, .85);\n  margin: 9px;\n  overflow: hidden;\n  display: flex;\n  flex-direction: column;\n  font-size: 13px;\n}\n.url-bar {\n  flex-shrink: 0;\n  margin: 14px 16px 4px;\n  height: 30px;\n  border-radius: 10px;\n  background: var(--surface);\n  display: flex;\n  align-items: center;\n  justify-content: center;\n  gap: 6px;\n  font-size: 12px;\n  color: var(--text-3);\n}\n.url-bar strong { color: var(--text-2); font-weight: 500; }\n.url-bar .i { width: 12px; height: 12px; }\n\n.progress { height: 4px; margin: 12px 16px 0; border-radius: 99px; background: var(--surface-2); overflow: hidden; flex-shrink: 0; }\n.progress > span { display: block; height: 100%; background: var(--flame); border-radius: inherit; }\n\n.webapp-content {\n  flex: 1;\n  min-height: 0;\n  display: flex;\n  flex-direction: column;\n  gap: 12px;\n  padding: 14px 16px 22px;\n}\n\n.step-label { font-size: 11px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--flame); margin-bottom: 4px; }\n.step-label.green { color: var(--green); }\n.screen-title { font-size: 20px; line-height: 1.2; font-weight: 700; letter-spacing: -.02em; }\n.screen-sub { font-size: 13px; line-height: 1.45; color: var(--text-2); margin-top: 6px; }\n.screen-sub strong { color: var(--text); font-weight: 600; }\n\n/* ---------- Ícones ---------- */\n.i { width: 16px; height: 16px; flex-shrink: 0; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }\n\n/* ---------- Campos ---------- */\n.fields { display: flex; flex-direction: column; gap: 10px; }\n.field > label, .label { display: block; font-size: 12px; font-weight: 500; color: var(--text-2); margin-bottom: 6px; }\n.input {\n  height: 42px;\n  display: flex;\n  align-items: center;\n  gap: 10px;\n  padding: 0 12px;\n  border-radius: 12px;\n  background: var(--surface);\n  border: 1px solid var(--line);\n  font-size: 14px;\n}\n.input > .i { color: var(--text-3); }\n.input .value { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-variant-numeric: tabular-nums; }\n.input .trail { display: flex; align-items: center; gap: 4px; font-size: 12px; font-weight: 500; color: var(--green); white-space: nowrap; }\n\n/* ---------- Botões ---------- */\n.btn {\n  height: 48px;\n  flex-shrink: 0;\n  display: flex;\n  align-items: center;\n  justify-content: center;\n  gap: 8px;\n  border-radius: 14px;\n  font-size: 14px;\n  font-weight: 600;\n  color: #fff;\n  margin-top: auto;\n}\n.btn-primary { background: var(--flame); }\n.btn-success { background: var(--green); }\n\n/* ---------- Cards e seleção ---------- */\n.card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 12px; }\n.row { display: flex; align-items: center; justify-content: space-between; gap: 10px; }\n.num { font-size: 20px; font-weight: 700; letter-spacing: -.02em; font-variant-numeric: tabular-nums; }\n.unit { font-size: 12px; font-weight: 500; color: var(--text-3); margin-left: 2px; letter-spacing: 0; }\n\n.segmented { display: flex; gap: 4px; }\n.seg {\n  flex: 1;\n  min-width: 0;\n  height: 34px;\n  display: grid;\n  place-items: center;\n  border-radius: 9px;\n  background: var(--surface-2);\n  border: 1px solid transparent;\n  font-size: 12px;\n  font-weight: 500;\n  color: var(--text-2);\n}\n.seg small { display: block; font-size: 10px; color: var(--text-3); font-weight: 400; margin-top: 1px; }\n.seg.tall { height: 46px; text-align: center; line-height: 1.2; }\n.seg.is-selected { background: var(--flame-soft); border-color: var(--flame-line); color: var(--text); font-weight: 600; }\n.seg.is-selected small { color: var(--flame); }\n\n.options { display: flex; flex-direction: column; gap: 6px; }\n.option {\n  display: flex;\n  align-items: center;\n  gap: 10px;\n  padding: 9px 12px;\n  border-radius: 12px;\n  background: var(--surface-2);\n  border: 1px solid transparent;\n}\n.opt-title { font-size: 13px; font-weight: 600; }\n.opt-desc { font-size: 11px; color: var(--text-2); margin-top: 2px; line-height: 1.35; }\n.opt-meta { margin-left: auto; font-size: 11px; font-weight: 600; color: var(--text-3); white-space: nowrap; }\n.option.is-selected { background: var(--flame-soft); border-color: var(--flame-line); }\n.option.is-selected .opt-meta { color: var(--flame); }\n\n.chips { display: flex; flex-wrap: wrap; gap: 6px; }\n.chip {\n  display: inline-flex;\n  align-items: center;\n  gap: 5px;\n  height: 30px;\n  padding: 0 10px;\n  border-radius: 99px;\n  background: var(--surface-2);\n  font-size: 12px;\n  font-weight: 500;\n  color: var(--text-2);\n}\n.chip.is-selected { background: var(--flame-soft); color: var(--text); box-shadow: inset 0 0 0 1px var(--flame-line); }\n.chip .i { width: 14px; height: 14px; }\n\n.c-flame { color: var(--flame); }\n.c-green { color: var(--green); }\n.c-violet { color: var(--violet); }\n.c-water { color: var(--water); }\n.c-muted { color: var(--text-2); }\n\n/* ---------- Cabeçalho interno do app (voltar + caminho) ---------- */\n.app-top {\n  flex-shrink: 0;\n  display: flex;\n  align-items: center;\n  gap: 10px;\n  padding: 12px 16px 0;\n  font-size: 12px;\n  color: var(--text-3);\n}\n.app-top .back {\n  width: 30px;\n  height: 30px;\n  border-radius: 10px;\n  background: var(--surface);\n  display: grid;\n  place-items: center;\n  color: var(--text);\n  flex-shrink: 0;\n}\n.app-top strong { color: var(--text-2); font-weight: 500; }\n\n/* ---------- Barra de abas inferior ---------- */\n.tabbar {\n  flex-shrink: 0;\n  display: flex;\n  justify-content: space-around;\n  padding: 10px 8px 18px;\n  border-top: 1px solid var(--line);\n}\n.tab { display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 10px; font-weight: 500; color: var(--text-3); }\n.tab .i { width: 20px; height: 20px; }\n.tab.active { color: var(--flame); }\n\n/* ---------- Indicador de toque (onde o usuário toca para ir à próxima tela) ---------- */\n.tap { position: relative; }\n.tap-dot {\n  position: absolute;\n  z-index: 2;\n  width: 26px;\n  height: 26px;\n  margin: -13px 0 0 -13px;\n  border-radius: 99px;\n  background: rgba(255, 255, 255, .22);\n  border: 2px solid rgba(255, 255, 255, .75);\n  pointer-events: none;\n}\n.tap-dot::after {\n  content: \"\";\n  position: absolute;\n  inset: -8px;\n  border-radius: inherit;\n  border: 2px solid rgba(255, 255, 255, .35);\n  animation: tap-pulse 1.8s ease-out infinite;\n}\n@keyframes tap-pulse {\n  from { transform: scale(.6); opacity: 1; }\n  to   { transform: scale(1.4); opacity: 0; }\n}\n\n/* ---------- Interruptor ---------- */\n.switch { width: 40px; height: 24px; border-radius: 99px; background: var(--surface-2); position: relative; flex-shrink: 0; }\n.switch::after { content: \"\"; position: absolute; top: 3px; left: 3px; width: 18px; height: 18px; border-radius: 99px; background: var(--text-3); }\n.switch.on { background: var(--flame); }\n.switch.on::after { left: 19px; background: #fff; }\n\n/* ---------- Botões secundários ---------- */\n.btn-dashed {\n  height: 44px;\n  flex-shrink: 0;\n  display: flex;\n  align-items: center;\n  justify-content: center;\n  gap: 8px;\n  border-radius: 12px;\n  border: 1.5px dashed var(--line-strong);\n  font-size: 13px;\n  font-weight: 600;\n  color: var(--text-2);\n}\n.btn-outline {\n  height: 36px;\n  flex: 1;\n  display: flex;\n  align-items: center;\n  justify-content: center;\n  gap: 6px;\n  border-radius: 10px;\n  background: var(--surface-2);\n  font-size: 13px;\n  font-weight: 600;\n}\n.btn-outline.primary { background: var(--flame); color: #fff; }\n\n/* ---------- Estado de campo em digitação ---------- */\n.input.is-focus { border-color: var(--flame); box-shadow: 0 0 0 3px var(--flame-soft); }\n.input.is-focus .value::after {\n  content: \"\";\n  display: inline-block;\n  width: 1.5px;\n  height: 15px;\n  margin-left: 2px;\n  vertical-align: -3px;\n  background: var(--flame);\n  animation: caret 1s steps(1) infinite;\n}\n@keyframes caret { 50% { opacity: 0; } }\n\n/* ---------- Hierarquia de botões ----------\n   .btn-primary   → 1 por tela: avança ou conclui o fluxo (sempre embaixo)\n   .btn-secondary → ação que continua na mesma tela (adicionar outro item, criar outro)\n   ------------------------------------------ */\n.btn-secondary {\n  height: 44px;\n  flex-shrink: 0;\n  display: flex;\n  align-items: center;\n  justify-content: center;\n  gap: 8px;\n  border-radius: 12px;\n  background: var(--surface);\n  border: 1px solid var(--line-strong);\n  font-size: 13px;\n  font-weight: 600;\n  color: var(--text);\n}\n\n/* ---------- Botão central \"+\" da barra de abas (registrar: check-in / refeição) ---------- */\n.tab-plus {\n  position: relative;\n  z-index: 6;\n  width: 48px;\n  height: 48px;\n  margin-top: -20px;\n  border-radius: 16px;\n  background: var(--flame);\n  color: #fff;\n  display: grid;\n  place-items: center;\n  box-shadow: 0 0 0 5px var(--app-bg);\n o\"/><\/svg><span>Estimativa pela equação de Mifflin-St Jeor e referências de macros por kg. Não substitui nutricionista ou médico. <b class=\"lnk\">Como calculamos<\/b><\/span><\/div>\n          <div class=\"btn btn-success\">Começar a usar o BioForm Health OS <svg class=\"i\"><use href=\"#i-arrow\"/><\/svg><\/div>\n        <\/div>\n      <\/div>\n    <\/div>\n\n  <\/div>\n\n  <div class=\"deck-footer-nav\">\n    <div class=\"nav-arrows\">\n      <a href=\"00-abertura.html\" class=\"arrow-btn\">← Abertura<\/a>\n      <a href=\"02-inicio-painel-configuracoes.html\" class=\"arrow-btn primary\">Módulo 2 →<\/a>\n    <\/div>\n  <\/div>\n<script>document.addEventListener('click',function(e){var a=e.target.closest('a');if(!a)return;var h=a.getAttribute('href');if(h&&!/^(https?:|#|mailto:)/.test(h)){e.preventDefault();parent.postMessage({go:h.split('?')[0]},'*');}});<\/script><\/body>\n<\/html>\n", "02-inicio-painel-configuracoes.html": "<!DOCTYPE html>\n<html lang=\"pt-BR\">\n<head>\n  <meta charset=\"UTF-8\">\n  <meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n  <title>BioForm Health OS - Módulo 2: Início, Painel & Configurações<\/title>\n  <link rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n  <link rel=\"preconnect\" href=\"https://fonts.gstatic.com\" crossorigin>\n  <link href=\"https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap\" rel=\"stylesheet\">\n  <style>/* ==========================================================================\n   BioForm Health OS — estilo compartilhado da apresentação (módulos 01 a 06)\n   ========================================================================== */\n\n:root {\n  --stage: #09090B;\n  --app-bg: #111113;\n  --surface: #1A1A1D;\n  --surface-2: #232327;\n  --line: rgba(255, 255, 255, 0.08);\n  --line-strong: rgba(255, 255, 255, 0.16);\n\n  --text: #FAFAFA;\n  --text-2: #A1A1AA;\n  --text-3: #8A8A93;\n\n  --flame: #FF5722;\n  --flame-soft: rgba(255, 87, 34, 0.12);\n  --flame-line: rgba(255, 87, 34, 0.55);\n  --green: #10B981;\n  --green-soft: rgba(16, 185, 129, 0.12);\n  --violet: #8B5CF6;\n  --violet-soft: rgba(139, 92, 246, 0.14);\n  --water: #38BDF8;\n  --water-soft: rgba(56, 189, 248, 0.12);\n\n  --font: 'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif;\n}\n\n* { box-sizing: border-box; margin: 0; padding: 0; }\n\nbody {\n  background: var(--stage);\n  color: var(--text);\n  font-family: var(--font);\n  -webkit-font-smoothing: antialiased;\n  padding: 20px 20px 48px;\n  display: flex;\n  flex-direction: column;\n  align-items: center;\n}\n\n/* ---------- Barra de navegação da apresentação ---------- */\n.deck-nav-bar {\n  width: 100%;\n  max-width: 1180px;\n  display: flex;\n  justify-content: space-between;\n  align-items: center;\n  flex-wrap: wrap;\n  gap: 10px;\n  padding: 10px 14px;\n  margin-bottom: 32px;\n  background: var(--surface);\n  border: 1px solid var(--line);\n  border-radius: 14px;\n}\n.deck-nav-left { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }\n.deck-modules-pills { display: flex; gap: 2px; flex-wrap: wrap; }\n.nav-btn-hub, .mod-pill-link, .arrow-btn {\n  display: inline-flex;\n  align-items: center;\n  gap: 6px;\n  font-size: 13px;\n  text-decoration: none;\n  border-radius: 8px;\n  padding: 6px 10px;\n}\n.nav-btn-hub { color: var(--text); font-weight: 600; background: var(--surface-2); }\n.mod-pill-link { color: var(--text-2); }\n.mod-pill-link:hover { color: var(--text); }\n.mod-pill-link.active { color: var(--text); background: var(--surface-2); font-weight: 600; }\n.nav-arrows { display: flex; gap: 6px; }\n.arrow-btn { font-weight: 600; color: var(--text); background: var(--surface-2); }\n.arrow-btn.primary { background: var(--flame); color: #fff; }\n\n/* ---------- Cabeçalho do módulo ---------- */\n.header-section { text-align: center; max-width: 820px; margin-bottom: 36px; }\n.badge-module {\n  display: inline-block;\n  font-size: 12px;\n  font-weight: 600;\n  letter-spacing: .06em;\n  text-transform: uppercase;\n  color: var(--flame);\n  margin-bottom: 12px;\n}\n.header-section h1 { font-size: 30px; line-height: 1.2; font-weight: 700; letter-spacing: -.02em; margin-bottom: 10px; }\n.header-section p { font-size: 15px; line-height: 1.6; color: var(--text-2); }\n.header-section p strong { color: var(--text); font-weight: 600; }\n\n/* ---------- Grade de telas ---------- */\n.frames-container { display: flex; flex-wrap: wrap; justify-content: center; gap: 40px 32px; }\n.frame-title { text-align: center; font-size: 14px; font-weight: 600; margin-bottom: 18px; }\n.frame-title span { color: var(--flame); margin-right: 4px; }\n\n/* ---------- Moldura do web app ---------- */\n.webapp-frame {\n  width: 340px;\n  height: 720px;\n  border-radius: 40px;\n  background: var(--app-bg);\n  box-shadow: 0 0 0 8px #1C1C1F, 0 0 0 9px #303036, 0 32px 70px -20px rgba(0, 0, 0, .85);\n  margin: 9px;\n  overflow: hidden;\n  display: flex;\n  flex-direction: column;\n  font-size: 13px;\n}\n.url-bar {\n  flex-shrink: 0;\n  margin: 14px 16px 4px;\n  height: 30px;\n  border-radius: 10px;\n  background: var(--surface);\n  display: flex;\n  align-items: center;\n  justify-content: center;\n  gap: 6px;\n  font-size: 12px;\n  color: var(--text-3);\n}\n.url-bar strong { color: var(--text-2); font-weight: 500; }\n.url-bar .i { width: 12px; height: 12px; }\n\n.progress { height: 4px; margin: 12px 16px 0; border-radius: 99px; background: var(--surface-2); overflow: hidden; flex-shrink: 0; }\n.progress > span { display: block; height: 100%; background: var(--flame); border-radius: inherit; }\n\n.webapp-content {\n  flex: 1;\n  min-height: 0;\n  display: flex;\n  flex-direction: column;\n  gap: 12px;\n  padding: 14px 16px 22px;\n}\n\n.step-label { font-size: 11px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--flame); margin-bottom: 4px; }\n.step-label.green { color: var(--green); }\n.screen-title { font-size: 20px; line-height: 1.2; font-weight: 700; letter-spacing: -.02em; }\n.screen-sub { font-size: 13px; line-height: 1.45; color: var(--text-2); margin-top: 6px; }\n.screen-sub strong { color: var(--text); font-weight: 600; }\n\n/* ---------- Ícones ---------- */\n.i { width: 16px; height: 16px; flex-shrink: 0; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }\n\n/* ---------- Campos ---------- */\n.fields { display: flex; flex-direction: column; gap: 10px; }\n.field > label, .label { display: block; font-size: 12px; font-weight: 500; color: var(--text-2); margin-bottom: 6px; }\n.input {\n  height: 42px;\n  display: flex;\n  align-items: center;\n  gap: 10px;\n  padding: 0 12px;\n  border-radius: 12px;\n  background: var(--surface);\n  border: 1px solid var(--line);\n  font-size: 14px;\n}\n.input > .i { color: var(--text-3); }\n.input .value { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-variant-numeric: tabular-nums; }\n.input .trail { display: flex; align-items: center; gap: 4px; font-size: 12px; font-weight: 500; color: var(--green); white-space: nowrap; }\n\n/* ---------- Botões ---------- */\n.btn {\n  height: 48px;\n  flex-shrink: 0;\n  display: flex;\n  align-items: center;\n  justify-content: center;\n  gap: 8px;\n  border-radius: 14px;\n  font-size: 14px;\n  font-weight: 600;\n  color: #fff;\n  margin-top: auto;\n}\n.btn-primary { background: var(--flame); }\n.btn-success { background: var(--green); }\n\n/* ---------- Cards e seleção ---------- */\n.card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 12px; }\n.row { display: flex; align-items: center; justify-content: space-between; gap: 10px; }\n.num { font-size: 20px; font-weight: 700; letter-spacing: -.02em; font-variant-numeric: tabular-nums; }\n.unit { font-size: 12px; font-weight: 500; color: var(--text-3); margin-left: 2px; letter-spacing: 0; }\n\n.segmented { display: flex; gap: 4px; }\n.seg {\n  flex: 1;\n  min-width: 0;\n  height: 34px;\n  display: grid;\n  place-items: center;\n  border-radius: 9px;\n  background: var(--surface-2);\n  border: 1px solid transparent;\n  font-size: 12px;\n  font-weight: 500;\n  color: var(--text-2);\n}\n.seg small { display: block; font-size: 10px; color: var(--text-3); font-weight: 400; margin-top: 1px; }\n.seg.tall { height: 46px; text-align: center; line-height: 1.2; }\n.seg.is-selected { background: var(--flame-soft); border-color: var(--flame-line); color: var(--text); font-weight: 600; }\n.seg.is-selected small { color: var(--flame); }\n\n.options { display: flex; flex-direction: column; gap: 6px; }\n.option {\n  display: flex;\n  align-items: center;\n  gap: 10px;\n  padding: 9px 12px;\n  border-radius: 12px;\n  background: var(--surface-2);\n  border: 1px solid transparent;\n}\n.opt-title { font-size: 13px; font-weight: 600; }\n.opt-desc { font-size: 11px; color: var(--text-2); margin-top: 2px; line-height: 1.35; }\n.opt-meta { margin-left: auto; font-size: 11px; font-weight: 600; color: var(--text-3); white-space: nowrap; }\n.option.is-selected { background: var(--flame-soft); border-color: var(--flame-line); }\n.option.is-selected .opt-meta { color: var(--flame); }\n\n.chips { display: flex; flex-wrap: wrap; gap: 6px; }\n.chip {\n  display: inline-flex;\n  align-items: center;\n  gap: 5px;\n  height: 30px;\n  padding: 0 10px;\n  border-radius: 99px;\n  background: var(--surface-2);\n  font-size: 12px;\n  font-weight: 500;\n  color: var(--text-2);\n}\n.chip.is-selected { background: var(--flame-soft); color: var(--text); box-shadow: inset 0 0 0 1px var(--flame-line); }\n.chip .i { width: 14px; height: 14px; }\n\n.c-flame { color: var(--flame); }\n.c-green { color: var(--green); }\n.c-violet { color: var(--violet); }\n.c-water { color: var(--water); }\n.c-muted { color: var(--text-2); }\n\n/* ---------- Cabeçalho interno do app (voltar + caminho) ---------- */\n.app-top {\n  flex-shrink: 0;\n  display: flex;\n  align-items: center;\n  gap: 10px;\n  padding: 12px 16px 0;\n  font-size: 12px;\n  color: var(--text-3);\n}\n.app-top .back {\n  width: 30px;\n  height: 30px;\n  border-radius: 10px;\n  background: var(--surface);\n  display: grid;\n  place-items: center;\n  color: var(--text);\n  flex-shrink: 0;\n}\n.app-top strong { color: var(--text-2); font-weight: 500; }\n\n/* ---------- Barra de abas inferior ---------- */\n.tabbar {\n  flex-shrink: 0;\n  display: flex;\n  justify-content: space-around;\n  padding: 10px 8px 18px;\n  border-top: 1px solid var(--line);\n}\n.tab { display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 10px; font-weight: 500; color: var(--text-3); }\n.tab .i { width: 20px; height: 20px; }\n.tab.active { color: var(--flame); }\n\n/* ---------- Indicador de toque (onde o usuário toca para ir à próxima tela) ---------- */\n.tap { position: relative; }\n.tap-dot {\n  position: absolute;\n  z-index: 2;\n  width: 26px;\n  height: 26px;\n  margin: -13px 0 0 -13px;\n  border-radius: 99px;\n  background: rgba(255, 255, 255, .22);\n  border: 2px solid rgba(255, 255, 255, .75);\n  pointer-events: none;\n}\n.tap-dot::after {\n  content: \"\";\n  position: absolute;\n  inset: -8px;\n  border-radius: inherit;\n  border: 2px solid rgba(255, 255, 255, .35);\n  animation: tap-pulse 1.8s ease-out infinite;\n}\n@keyframes tap-pulse {\n  from { transform: scale(.6); opacity: 1; }\n  to   { transform: scale(1.4); opacity: 0; }\n}\n\n/* ---------- Interruptor ---------- */\n.switch { width: 40px; height: 24px; border-radius: 99px; background: var(--surface-2); position: relative; flex-shrink: 0; }\n.switch::after { content: \"\"; position: absolute; top: 3px; left: 3px; width: 18px; height: 18px; border-radius: 99px; background: var(--text-3); }\n.switch.on { background: var(--flame); }\n.switch.on::after { left: 19px; background: #fff; }\n\n/* ---------- Botões secundários ---------- */\n.btn-dashed {\n  height: 44px;\n  flex-shrink: 0;\n  display: flex;\n  align-items: center;\n  justify-content: center;\n  gap: 8px;\n  border-radius: 12px;\n  border: 1.5px dashed var(--line-strong);\n  font-size: 13px;\n  font-weight: 600;\n  color: var(--text-2);\n}\n.btn-outline {\n  height: 36px;\n  flex: 1;\n  display: flex;\n  align-items: center;\n  justify-content: center;\n  gap: 6px;\n  border-radius: 10px;\n  background: var(--surface-2);\n  font-size: 13px;\n  font-weight: 600;\n}\n.btn-outline.primary { background: var(--flame); color: #fff; }\n\n/* ---------- Estado de campo em digitação ---------- */\n.input.is-focus { border-color: var(--flame); box-shadow: 0 0 0 3px var(--flame-soft); }\n.input.is-focus .value::after {\n  content: \"\";\n  display: inline-block;\n  width: 1.5px;\n  height: 15px;\n  margin-left: 2px;\n  vertical-align: -3px;\n  background: var(--flame);\n  animation: caret 1s steps(1) infinite;\n}\n@keyframes caret { 50% { opacity: 0; } }\n\n/* ---------- Hierarquia de botões ----------\n   .btn-primary   → 1 por tela: avança ou conclui o fluxo (sempre embaixo)\n   .btn-secondary → ação que continua na mesma tela (adicionar outro item, criar outro)\n   ------------------------------------------ */\n.btn-secondary {\n  height: 44px;\n  flex-shrink: 0;\n  display: flex;\n  align-items: center;\n  justify-content: center;\n  gap: 8px;\n  border-radius: 12px;\n  background: var(--surface);\n  border: 1px solid var(--line-strong);\n  font-size: 13px;\n  font-weight: 600;\n  color: var(--text);\n}\n\n/* ---------- Botão central \"+\" da barra de abas (registrar: check-in / refeição) ---------- */\n.tab-plus {\n  position: relative;\n  z-index: 6;\n  width: 48px;\n  height: 48px;\n  margin-top: -20px;\n  border-radius: 16px;\n  background: var(--flame);\n  color: #fff;\n  display: grid;\n  place-items: center;\n  box-shadow: 0 0 0 5px var(--app-bg);\n  flex-shrink: 0;\n}\n.tab-plus .i { width: 22px; height: 22px; stroke-width: 2.4; }\n.tab-plus.open { background: var(--surface-2); }\n\n/* ---------- Botão flutuante \"+\" (registros rápidos) ----------\n   Fica acima da barra de abas, no canto inferior direito, ao alcance do polegar.\n   Não aparece em telas que já têm um botão principal no rodapé. */\n.webapp-frame { position: relative; }\n.fab {\n  position: absolute;\n  right: 16px;\n  bottom: 84px;\n  z-index: 6;\n  width: 52px;\n  height: 52px;\n  border-radius: 18px;\n  background: var(--flame);\n  color: #fff;\n  display: grid;\n  place-items: center;\n  box-shadow: 0 12px 24px -8px rgba(255, 87, 34, .6), 0 0 0 4px var(--app-bg);\n}\n.fab .i { width: 22px; height: 22px; stroke-width: 2.4; }\n.fab.open { background: var(--surface-2); box-shadow: 0 0 0 4px var(--app-bg); }\n.has-fab .webapp-content { padding-bottom: 46px; }\n\n.url-bar .bf-fav { width: 14px; height: 14px; flex-shrink: 0; border-radius: 4px; }\n\n.deck-footer-nav { max-width: 1400px; margin: 40px auto 24px; padding: 14px 18px; display: flex; justify-content: center; border-top: 1px solid var(--line); }\n.deck-footer-nav .nav-arrows { gap: 12px; }\n\n/* Avisos de saúde */\n.health-note { display: flex; gap: 8px; align-items: flex-start; font-size: 10.5px; line-height: 1.45; color: var(--text-3); padding: 8px 10px; border-radius: 10px; background: var(--surface); border: 1px solid var(--line); }\n.health-note .i { width: 14px; height: 14px; flex-shrink: 0; margin-top: 1px; color: var(--text-2); }\n.health-note .lnk { color: var(--flame); font-weight: 600; white-space: nowrap; }\n.sug-note { margin-top: 10px; padding-top: 8px; border-top: 1px solid var(--line); font-size: 10.5px; line-height: 1.4; color: var(--text-3); }\n.consent { display: flex; gap: 8px; align-items: flex-start; font-size: 11px; line-height: 1.45; color: var(--text-2); }\n.consent b { color: var(--flame); font-weight: 600; }\n.consent .box { width: 16px; height: 16px; border-radius: 5px; background: var(--flame); color: #fff; display: grid; place-items: center; flex-shrink: 0; margin-top: 1px; }\n.con ta\" style=\"margin:0;\">+400 kcal<\/span><span class=\"radio\"><\/span><\/div>\n            <div class=\"option\"><div style=\"flex:1; min-width:0;\"><div class=\"opt-title\">Comer melhor & longevidade<\/div><div class=\"opt-desc\">Qualidade e consistência<\/div><\/div><span class=\"opt-meta\" style=\"margin:0;\">Saúde<\/span><span class=\"radio\"><\/span><\/div>\n          <\/div>\n          <div class=\"card\" style=\"border-color:var(--flame-line);\">\n            <div class=\"label\" style=\"margin-bottom:8px;\">O que muda com o novo objetivo<\/div>\n            <div class=\"calc\"><span>Meta diária<\/span><span><s>2.180<\/s> → <strong>2.680 kcal<\/strong><\/span><\/div>\n            <div class=\"calc\"><span>Carboidratos<\/span><span><s>240 g<\/s> → <strong>366 g<\/strong><\/span><\/div>\n            <div class=\"calc\"><span>Proteínas e gorduras<\/span><span>mantidas (165 g • 62 g)<\/span><\/div>\n            <div class=\"sug-note\">Novas metas são estimativas, não prescrições.<\/div>\n          <\/div>\n          <div class=\"keep-note\"><svg class=\"i\"><use href=\"#i-lock\"/><\/svg><span><strong>Nada é apagado.<\/strong> Gráficos e insights de \"Perder peso\" ficam congelados em 22/09 e seguem consultáveis na Evolução.<\/span><\/div>\n          <div class=\"btn btn-primary tap\">Atualizar objetivo <svg class=\"i\"><use href=\"#i-check\"/><\/svg><span class=\"tap-dot\" style=\"left:86%; top:50%;\"><\/span><\/div>\n        <\/div>\n      <\/div>\n    <\/div>\n\n  <\/div>\n\n  <div class=\"deck-footer-nav\">\n    <div class=\"nav-arrows\">\n      <a href=\"01-cadastro-login-perfil.html\" class=\"arrow-btn\">← Módulo 1<\/a>\n      <a href=\"03-cadastro-fichas-esportes.html\" class=\"arrow-btn primary\">Módulo 3 →<\/a>\n    <\/div>\n  <\/div>\n<script>document.addEventListener('click',function(e){var a=e.target.closest('a');if(!a)return;var h=a.getAttribute('href');if(h&&!/^(https?:|#|mailto:)/.test(h)){e.preventDefault();parent.postMessage({go:h.split('?')[0]},'*');}});<\/script><\/body>\n<\/html>\n", "03-cadastro-fichas-esportes.html": "<!DOCTYPE html>\n<html lang=\"pt-BR\">\n<head>\n  <meta charset=\"UTF-8\">\n  <meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n  <title>BioForm Health OS - Módulo 3: Meus Esportes, Criação de Séries & Exercícios<\/title>\n  <link rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n  <link rel=\"preconnect\" href=\"https://fonts.gstatic.com\" crossorigin>\n  <link href=\"https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap\" rel=\"stylesheet\">\n  <style>/* ==========================================================================\n   BioForm Health OS — estilo compartilhado da apresentação (módulos 01 a 06)\n   ========================================================================== */\n\n:root {\n  --stage: #09090B;\n  --app-bg: #111113;\n  --surface: #1A1A1D;\n  --surface-2: #232327;\n  --line: rgba(255, 255, 255, 0.08);\n  --line-strong: rgba(255, 255, 255, 0.16);\n\n  --text: #FAFAFA;\n  --text-2: #A1A1AA;\n  --text-3: #8A8A93;\n\n  --flame: #FF5722;\n  --flame-soft: rgba(255, 87, 34, 0.12);\n  --flame-line: rgba(255, 87, 34, 0.55);\n  --green: #10B981;\n  --green-soft: rgba(16, 185, 129, 0.12);\n  --violet: #8B5CF6;\n  --violet-soft: rgba(139, 92, 246, 0.14);\n  --water: #38BDF8;\n  --water-soft: rgba(56, 189, 248, 0.12);\n\n  --font: 'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif;\n}\n\n* { box-sizing: border-box; margin: 0; padding: 0; }\n\nbody {\n  background: var(--stage);\n  color: var(--text);\n  font-family: var(--font);\n  -webkit-font-smoothing: antialiased;\n  padding: 20px 20px 48px;\n  display: flex;\n  flex-direction: column;\n  align-items: center;\n}\n\n/* ---------- Barra de navegação da apresentação ---------- */\n.deck-nav-bar {\n  width: 100%;\n  max-width: 1180px;\n  display: flex;\n  justify-content: space-between;\n  align-items: center;\n  flex-wrap: wrap;\n  gap: 10px;\n  padding: 10px 14px;\n  margin-bottom: 32px;\n  background: var(--surface);\n  border: 1px solid var(--line);\n  border-radius: 14px;\n}\n.deck-nav-left { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }\n.deck-modules-pills { display: flex; gap: 2px; flex-wrap: wrap; }\n.nav-btn-hub, .mod-pill-link, .arrow-btn {\n  display: inline-flex;\n  align-items: center;\n  gap: 6px;\n  font-size: 13px;\n  text-decoration: none;\n  border-radius: 8px;\n  padding: 6px 10px;\n}\n.nav-btn-hub { color: var(--text); font-weight: 600; background: var(--surface-2); }\n.mod-pill-link { color: var(--text-2); }\n.mod-pill-link:hover { color: var(--text); }\n.mod-pill-link.active { color: var(--text); background: var(--surface-2); font-weight: 600; }\n.nav-arrows { display: flex; gap: 6px; }\n.arrow-btn { font-weight: 600; color: var(--text); background: var(--surface-2); }\n.arrow-btn.primary { background: var(--flame); color: #fff; }\n\n/* ---------- Cabeçalho do módulo ---------- */\n.header-section { text-align: center; max-width: 820px; margin-bottom: 36px; }\n.badge-module {\n  display: inline-block;\n  font-size: 12px;\n  font-weight: 600;\n  letter-spacing: .06em;\n  text-transform: uppercase;\n  color: var(--flame);\n  margin-bottom: 12px;\n}\n.header-section h1 { font-size: 30px; line-height: 1.2; font-weight: 700; letter-spacing: -.02em; margin-bottom: 10px; }\n.header-section p { font-size: 15px; line-height: 1.6; color: var(--text-2); }\n.header-section p strong { color: var(--text); font-weight: 600; }\n\n/* ---------- Grade de telas ---------- */\n.frames-container { display: flex; flex-wrap: wrap; justify-content: center; gap: 40px 32px; }\n.frame-title { text-align: center; font-size: 14px; font-weight: 600; margin-bottom: 18px; }\n.frame-title span { color: var(--flame); margin-right: 4px; }\n\n/* ---------- Moldura do web app ---------- */\n.webapp-frame {\n  width: 340px;\n  height: 720px;\n  border-radius: 40px;\n  background: var(--app-bg);\n  box-shadow: 0 0 0 8px #1C1C1F, 0 0 0 9px #303036, 0 32px 70px -20px rgba(0, 0, 0, .85);\n  margin: 9px;\n  overflow: hidden;\n  display: flex;\n  flex-direction: column;\n  font-size: 13px;\n}\n.url-bar {\n  flex-shrink: 0;\n  margin: 14px 16px 4px;\n  height: 30px;\n  border-radius: 10px;\n  background: var(--surface);\n  display: flex;\n  align-items: center;\n  justify-content: center;\n  gap: 6px;\n  font-size: 12px;\n  color: var(--text-3);\n}\n.url-bar strong { color: var(--text-2); font-weight: 500; }\n.url-bar .i { width: 12px; height: 12px; }\n\n.progress { height: 4px; margin: 12px 16px 0; border-radius: 99px; background: var(--surface-2); overflow: hidden; flex-shrink: 0; }\n.progress > span { display: block; height: 100%; background: var(--flame); border-radius: inherit; }\n\n.webapp-content {\n  flex: 1;\n  min-height: 0;\n  display: flex;\n  flex-direction: column;\n  gap: 12px;\n  padding: 14px 16px 22px;\n}\n\n.step-label { font-size: 11px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--flame); margin-bottom: 4px; }\n.step-label.green { color: var(--green); }\n.screen-title { font-size: 20px; line-height: 1.2; font-weight: 700; letter-spacing: -.02em; }\n.screen-sub { font-size: 13px; line-height: 1.45; color: var(--text-2); margin-top: 6px; }\n.screen-sub strong { color: var(--text); font-weight: 600; }\n\n/* ---------- Ícones ---------- */\n.i { width: 16px; height: 16px; flex-shrink: 0; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }\n\n/* ---------- Campos ---------- */\n.fields { display: flex; flex-direction: column; gap: 10px; }\n.field > label, .label { display: block; font-size: 12px; font-weight: 500; color: var(--text-2); margin-bottom: 6px; }\n.input {\n  height: 42px;\n  display: flex;\n  align-items: center;\n  gap: 10px;\n  padding: 0 12px;\n  border-radius: 12px;\n  background: var(--surface);\n  border: 1px solid var(--line);\n  font-size: 14px;\n}\n.input > .i { color: var(--text-3); }\n.input .value { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-variant-numeric: tabular-nums; }\n.input .trail { display: flex; align-items: center; gap: 4px; font-size: 12px; font-weight: 500; color: var(--green); white-space: nowrap; }\n\n/* ---------- Botões ---------- */\n.btn {\n  height: 48px;\n  flex-shrink: 0;\n  display: flex;\n  align-items: center;\n  justify-content: center;\n  gap: 8px;\n  border-radius: 14px;\n  font-size: 14px;\n  font-weight: 600;\n  color: #fff;\n  margin-top: auto;\n}\n.btn-primary { background: var(--flame); }\n.btn-success { background: var(--green); }\n\n/* ---------- Cards e seleção ---------- */\n.card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 12px; }\n.row { display: flex; align-items: center; justify-content: space-between; gap: 10px; }\n.num { font-size: 20px; font-weight: 700; letter-spacing: -.02em; font-variant-numeric: tabular-nums; }\n.unit { font-size: 12px; font-weight: 500; color: var(--text-3); margin-left: 2px; letter-spacing: 0; }\n\n.segmented { display: flex; gap: 4px; }\n.seg {\n  flex: 1;\n  min-width: 0;\n  height: 34px;\n  display: grid;\n  place-items: center;\n  border-radius: 9px;\n  background: var(--surface-2);\n  border: 1px solid transparent;\n  font-size: 12px;\n  font-weight: 500;\n  color: var(--text-2);\n}\n.seg small { display: block; font-size: 10px; color: var(--text-3); font-weight: 400; margin-top: 1px; }\n.seg.tall { height: 46px; text-align: center; line-height: 1.2; }\n.seg.is-selected { background: var(--flame-soft); border-color: var(--flame-line); color: var(--text); font-weight: 600; }\n.seg.is-selected small { color: var(--flame); }\n\n.options { display: flex; flex-direction: column; gap: 6px; }\n.option {\n  display: flex;\n  align-items: center;\n  gap: 10px;\n  padding: 9px 12px;\n  border-radius: 12px;\n  background: var(--surface-2);\n  border: 1px solid transparent;\n}\n.opt-title { font-size: 13px; font-weight: 600; }\n.opt-desc { font-size: 11px; color: var(--text-2); margin-top: 2px; line-height: 1.35; }\n.opt-meta { margin-left: auto; font-size: 11px; font-weight: 600; color: var(--text-3); white-space: nowrap; }\n.option.is-selected { background: var(--flame-soft); border-color: var(--flame-line); }\n.option.is-selected .opt-meta { color: var(--flame); }\n\n.chips { display: flex; flex-wrap: wrap; gap: 6px; }\n.chip {\n  display: inline-flex;\n  align-items: center;\n  gap: 5px;\n  height: 30px;\n  padding: 0 10px;\n  border-radius: 99px;\n  background: var(--surface-2);\n  font-size: 12px;\n  font-weight: 500;\n  color: var(--text-2);\n}\n.chip.is-selected { background: var(--flame-soft); color: var(--text); box-shadow: inset 0 0 0 1px var(--flame-line); }\n.chip .i { width: 14px; height: 14px; }\n\n.c-flame { color: var(--flame); }\n.c-green { color: var(--green); }\n.c-violet { color: var(--violet); }\n.c-water { color: var(--water); }\n.c-muted { color: var(--text-2); }\n\n/* ---------- Cabeçalho interno do app (voltar + caminho) ---------- */\n.app-top {\n  flex-shrink: 0;\n  display: flex;\n  align-items: center;\n  gap: 10px;\n  padding: 12px 16px 0;\n  font-size: 12px;\n  color: var(--text-3);\n}\n.app-top .back {\n  width: 30px;\n  height: 30px;\n  border-radius: 10px;\n  background: var(--surface);\n  display: grid;\n  place-items: center;\n  color: var(--text);\n  flex-shrink: 0;\n}\n.app-top strong { color: var(--text-2); font-weight: 500; }\n\n/* ---------- Barra de abas inferior ---------- */\n.tabbar {\n  flex-shrink: 0;\n  display: flex;\n  justify-content: space-around;\n  padding: 10px 8px 18px;\n  border-top: 1px solid var(--line);\n}\n.tab { display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 10px; font-weight: 500; color: var(--text-3); }\n.tab .i { width: 20px; height: 20px; }\n.tab.active { color: var(--flame); }\n\n/* ---------- Indicador de toque (onde o usuário toca para ir à próxima tela) ---------- */\n.tap { position: relative; }\n.tap-dot {\n  position: absolute;\n  z-index: 2;\n  width: 26px;\n  height: 26px;\n  margin: -13px 0 0 -13px;\n  border-radius: 99px;\n  background: rgba(255, 255, 255, .22);\n  border: 2px solid rgba(255, 255, 255, .75);\n  pointer-events: none;\n}\n.tap-dot::after {\n  content: \"\";\n  position: absolute;\n  inset: -8px;\n  border-radius: inherit;\n  border: 2px solid rgba(255, 255, 255, .35);\n  animation: tap-pulse 1.8s ease-out infinite;\n}\n@keyframes tap-pulse {\n  from { transform: scale(.6); opacity: 1; }\n  to   { transform: scale(1.4); opacity: 0; }\n}\n\n/* ---------- Interruptor ---------- */\n.switch { width: 40px; height: 24px; border-radius: 99px; background: var(--surface-2); position: relative; flex-shrink: 0; }\n.switch::after { content: \"\"; position: absolute; top: 3px; left: 3px; width: 18px; height: 18px; border-radius: 99px; background: var(--text-3); }\n.switch.on { background: var(--flame); }\n.switch.on::after { left: 19px; background: #fff; }\n\n/* ---------- Botões secundários ---------- */\n.btn-dashed {\n  height: 44px;\n  flex-shrink: 0;\n  display: flex;\n  align-items: center;\n  justify-content: center;\n  gap: 8px;\n  border-radius: 12px;\n  border: 1.5px dashed var(--line-strong);\n  font-size: 13px;\n  font-weight: 600;\n  color: var(--text-2);\n}\n.btn-outline {\n  height: 36px;\n  flex: 1;\n  display: flex;\n  align-items: center;\n  justify-content: center;\n  gap: 6px;\n  border-radius: 10px;\n  background: var(--surface-2);\n  font-size: 13px;\n  font-weight: 600;\n}\n.btn-outline.primary { background: var(--flame); color: #fff; }\n\n/* ---------- Estado de campo em digitação ---------- */\n.input.is-focus { border-color: var(--flame); box-shadow: 0 0 0 3px var(--flame-soft); }\n.input.is-focus .value::after {\n  content: \"\";\n  display: inline-block;\n  width: 1.5px;\n  height: 15px;\n  margin-left: 2px;\n  vertical-align: -3px;\n  background: var(--flame);\n  animation: caret 1s steps(1) infinite;\n}\n@keyframes caret { 50% { opacity: 0; } }\n\n/* ---------- Hierarquia de botões ----------\n   .btn-primary   → 1 por tela: avança ou conclui o fluxo (sempre embaixo)\n   .btn-secondary → ação que continua na mesma tela (adicionar outro item, criar outro)\n   ------------------------------------------ */\n.btn-secondary {\n  height: 44px;\n  flex-shrink: 0;\n  display: flex;\n  align-items: center;\n  justify-content: center;\n  gap: 8px;\n  border-radius: 12px;\n  background: var(--surface);\n  border: 1px solid var(--line-strong);\n  font-size: 13px;\n  font-weight: 600;\n  color: var(--text);\n}\n\n/* ---------- Botão central \"+\" da barra de abas (registrar: check-in / refeição) ---------- */\n.tab-plus {\n  position: relative;\n  z-index: 6;\n  width: 48px;\n  height: 48px;\n  margin-top: -20px;\n  border-radius: 16px;\n  background: var(--flame);\n  color: #fff;\n  display: grid;\n  place-items: center;\n  box-shadow: 0 0 0 5px var(--app-bg);\n  flex-shrink: 0;\n}\n.tab-plus .i { width: 22px; height: 22px; stroke-width: 2.4; }\n.tab-plus.open { background: var(--surface-2); }\n\n/* ---------- Botão flutuante \"+\" (registros rápidos) ----------\n   Fica acima da barra de abas, no canto inferior direito, ao alcance do polegar.\n   Não aparece em telas que já têm um botão principal no rodapé. */\n.webapp-frame { position: relative; }\n.fab {\n  position: absolute;\n  right: 16px;\n  bottom: 84px;\n  z-index: 6;\n  width: 52px;\n  height: 52px;\n  border-radius: 18px;\n  background: var(--flame);\n  color: #fff;\n  display: grid;\n  place-items: center;\n  box-shadow: 0 12px 24px -8px rgba(255, 87, 34, .6), 0 0 0 4px var(--app-bg);\n}\n.fab .i { width: 22px; height: 22px; stroke-width: 2.4; }\n.fab.open { background: var(--surface-2); box-shadow: 0 0 0 4px var(--app-bg); }\n.has-fab .webapp-content { padding-bottom: 46px; }\n\n.url-bar .bf-fav { width: 14px; height: 14px; flex-shrink: 0; border-radius: 4px; }\n\n.deck-footer-nav { max-width: 1400px; margin: 40px auto 24px; padding: 14px 18px; display: flex; justify-content: center; border-top: 1px solid var(--line); }\n.deck-footer-nav .nav-arrows { gap: 12px; }\n\n/* Avisos de saúde */\n.health-note { display: flex; gap: 8px; align-items: flex-start; font-size: 10.5px; line-height: 1.45; color: var(--text-3); padding: 8px 10px; border-radius: 10px; background: var(--surface); border: 1px solid var(--line); }\n.health-note .i { width: 14px; height: 14px; flex-shrink: 0; margin-top: 1px; color: var(--text-2); }\n.health-note .lnk { color: var(--flame); font-weight: 600; white-space: nowrap; }\n.sug-note { margin-top: 10px; padding-top: 8px; border-top: 1px solid var(--line); font-size: 10.5px; line-height: 1.4; color: var(--text-3); }\n.consent { display: flex; gap: 8px; align-items: flex-start; font-size: 11px; line-height: 1.45; color: var(--text-2); }\n.consent b { color: var(--flame); font-weight: 600; }\n.consent .box { width: 16px; height: 16px; border-radius: 5px; background: var(--flame); color: #fff; display: grid; place-items: center; flex-shrink: 0; margin-top: 1px; }\n.consent .box .i { width: 11px; height: 11px; stroke-width: 3; }\n<\/style>\n  <style>\n    /* Particularidades do Módulo 3 */\n    .sport-card { display: flex; align-items: center; gap: 12px; padding: 14px; }\n    .sport-icon { width: 40px; height: 40px; border-radius: 12px; background: var(--surface-2); display: grid; place-items: center; color: var(--text-2); flex-shrink: 0; }\n    .sport-icon .i { width: 20px; height: 20px; }\n    .sport-card.highlight { border-color: var(--flame-line); background: var(--flame-soft); }\n    .sport-card.highlight .sport-icon { background: var(--flame); color: #fff; }\n    .sport-name { font-size: 15px; font-weight: 600; }\n    .sport-meta { font-size: 12px; color: var(--text-2); margin-top: 2px; }\n    .chevron { margin-left: auto; color: var(--text-3); }\n\n    .empty-state { border: 1.5px dashed var(--li orrida, informa tempo e distância (ou tempo e pace) e o app calcula o restante. As séries também podem ser geridas pelo card de Musculação (ativas, inativas, editar e ver treino). O círculo branco indica onde o usuário toca para seguir.<\/p>\n  <\/div>\n\n  <div class=\"frames-container\">\n\n    <!-- TELA 4A: TREINOS — MESMA TELA DO MÓDULO 2, TOQUE NO + -->\n    <div>\n      <div class=\"frame-title\"><span>4A.<\/span>Treinos: Botão + Sempre à Mão<\/div>\n      <div class=\"webapp-frame has-fab\">\n        <div class=\"url-bar\"><svg class=\"bf-fav\"><use href=\"#bf-logo\"/><\/svg><strong>app.bioform.io<\/strong>/treinos/meus-esportes<\/div>\n        <div class=\"app-top\"><span>Início<\/span> / <strong>Meus esportes<\/strong><\/div>\n        <div class=\"webapp-content\">\n          <div>\n            <div class=\"step-label\">Esportes escolhidos no cadastro<\/div>\n            <div class=\"screen-title\">Toque na modalidade para abrir<\/div>\n          <\/div>\n\n          <div class=\"card sport-card\">\n            <div class=\"sport-icon\"><svg class=\"i\"><use href=\"#i-dumbbell\"/><\/svg><\/div>\n            <div>\n              <div class=\"sport-name\">Musculação<\/div>\n              <div class=\"sport-meta\">5x na semana • Intensa<\/div>\n            <\/div>\n            <svg class=\"i chevron\"><use href=\"#i-chevron\"/><\/svg>\n                      <\/div>\n\n          <div class=\"card sport-card\">\n            <div class=\"sport-icon\"><svg class=\"i\"><use href=\"#i-run\"/><\/svg><\/div>\n            <div>\n              <div class=\"sport-name\">Corrida de rua<\/div>\n              <div class=\"sport-meta\">2x na semana • Moderada<\/div>\n            <\/div>\n            <svg class=\"i chevron\"><use href=\"#i-chevron\"/><\/svg>\n          <\/div>\n\n          <div>\n            <span class=\"label\">Adicionar outro esporte à rotina<\/span>\n            <div class=\"sport-grid\">\n              <span class=\"add-chip\"><svg class=\"i\"><use href= y: flex;\n  flex-direction: column;\n  align-items: center;\n}\n\n/* ---------- Barra de navegação da apresentação ---------- */\n.deck-nav-bar {\n  width: 100%;\n  max-width: 1180px;\n  display: flex;\n  justify-content: space-between;\n  align-items: center;\n  flex-wrap: wrap;\n  gap: 10px;\n  padding: 10px 14px;\n  margin-bottom: 32px;\n  background: var(--surface);\n  border: 1px solid var(--line);\n  border-radius: 14px;\n}\n.deck-nav-left { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }\n.deck-modules-pills { display: flex; gap: 2px; flex-wrap: wrap; }\n.nav-btn-hub, .mod-pill-link, .arrow-btn {\n  display: inline-flex;\n  align-items: center;\n  gap: 6px;\n  font-size: 13px;\n  text-decoration: none;\n  border-radius: 8px;\n  padding: 6px 10px;\n}\n.nav-btn-hub { color: var(--text); font-weight: 600; background: var(--surface-2); }\n.mod-pill-link { color: var(--text-2); }\n.mod-pill-link:hover { color: var(--text); }\n.mod-pill-link.active { color: var(--text); background: var(--surface-2); font-weight: 600; }\n.nav-arrows { display: flex; gap: 6px; }\n.arrow-btn { font-weight: 600; color: var(--text); background: var(--surface-2); }\n.arrow-btn.primary { background: var(--flame); color: #fff; }\n\n/* ---------- Cabeçalho do módulo ---------- */\n.header-section { text-align: center; max-width: 820px; margin-bottom: 36px; }\n.badge-module {\n  display: inline-block;\n  font-size: 12px;\n  font-weight: 600;\n  letter-spacing: .06em;\n  text-transform: uppercase;\n  color: var(--flame);\n  margin-bottom: 12px;\n}\n.header-section h1 { font-size: 30px; line-height: 1.2; font-weight: 700; letter-spacing: -.02em; margin-bottom: 10px; }\n.header-section p { font-size: 15px; line-height: 1.6; color: var(--text-2); }\n.header-section p strong { color: var(--text); font-weight: 600; }\n\n/* ---------- Grade de telas ---------- */\n.frames-container { display: flex; flex-wrap: wrap; justify-content: center; gap: 40px 32px; }\n.frame-title { text-align: center; font-size: 14px; font-weight: 600; margin-bottom: 18px; }\n.frame-title span { color: var(--flame); margin-right: 4px; }\n\n/* ---------- Moldura do web app ---------- */\n.webapp-frame {\n  width: 340px;\n  height: 720px;\n  border-radius: 40px;\n  background: var(--app-bg);\n  box-shadow: 0 0 0 8px #1C1C1F, 0 0 0 9px #303036, 0 32px 70px -20px rgba(0, 0, 0, .85);\n  margin: 9px;\n  overflow: hidden;\n  display: flex;\n  flex-direction: column;\n  font-size: 13px;\n}\n.url-bar {\n  flex-shrink: 0;\n  margin: 14px 16px 4px;\n  height: 30px;\n  border-radius: 10px;\n  background: var(--surface);\n  display: flex;\n  align-items: center;\n  justify-content: center;\n  gap: 6px;\n  font-size: 12px;\n  color: var(--text-3);\n}\n.url-bar strong { color: var(--text-2); font-weight: 500; }\n.url-bar .i { width: 12px; height: 12px; }\n\n.progress { height: 4px; margin: 12px 16px 0; border-radius: 99px; background: var(--surface-2); overflow: hidden; flex-shrink: 0; }\n.progress > span { display: block; height: 100%; background: var(--flame); border-radius: inherit; }\n\n.webapp-content {\n  flex: 1;\n  min-height: 0;\n  display: flex;\n  flex-direction: column;\n  gap: 12px;\n  padding: 14px 16px 22px;\n}\n\n.step-label { font-size: 11px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--flame); margin-bottom: 4px; }\n.step-label.green { color: var(--green); }\n.screen-title { font-size: 20px; line-height: 1.2; font-weight: 700; letter-spacing: -.02em; }\n.screen-sub { font-size: 13px; line-height: 1.45; color: var(--text-2); margin-top: 6px; }\n.screen-sub strong { color: var(--text); font-weight: 600; }\n\n/* ---------- Ícones ---------- */\n.i { width: 16px; height: 16px; flex-shrink: 0; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }\n\n/* ---------- Campos ---------- */\n.fields { display: flex; flex-direction: column; gap: 10px; }\n.field > label, .label { display: block; font-size: 12px; font-weight: 500; color: var(--text-2); margin-bottom: 6px; }\n.input {\n  height: 42px;\n  display: flex;\n  align-items: center;\n  gap: 10px;\n  padding: 0 12px;\n  border-radius: 12px;\n  background: var(--surface);\n  border: 1px solid var(--line);\n  font-size: 14px;\n}\n.input > .i { color: var(--text-3); }\n.input .value { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-variant-numeric: tabular-nums; }\n.input .trail { display: flex; align-items: center; gap: 4px; font-size: 12px; font-weight: 500; color: var(--green); white-space: nowrap; }\n\n/* ---------- Botões ---------- */\n.btn {\n  height: 48px;\n  flex-shrink: 0;\n  display: flex;\n  align-items: center;\n  justify-content: center;\n  gap: 8px;\n  border-radius: 14px;\n  font-size: 14px;\n  font-weight: 600;\n  color: #fff;\n  margin-top: auto;\n}\n.btn-primary { background: var(--flame); }\n.btn-success { background: var(--green); }\n\n/* ---------- Cards e seleção ---------- */\n.card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 12px; }\n.row { display: flex; align-items: center; justify-content: space-between; gap: 10px; }\n.num { font-size: 20px; font-weight: 700; letter-spacing: -.02em; font-variant-numeric: tabular-nums; }\n.unit { font-size: 12px; font-weight: 500; color: var(--text-3); margin-left: 2px; letter-spacing: 0; }\n\n.segmented { display: flex; gap: 4px; }\n.seg {\n  flex: 1;\n  min-width: 0;\n  height: 34px;\n  display: grid;\n  place-items: center;\n  border-radius: 9px;\n  background: var(--surface-2);\n  border: 1px solid transparent;\n  font-size: 12px;\n  font-weight: 500;\n  color: var(--text-2);\n}\n.seg small { display: block; font-size: 10px; color: var(--text-3); font-weight: 400; margin-top: 1px; }\n.seg.tall { height: 46px; text-align: center; line-height: 1.2; }\n.seg.is-selected { background: var(--flame-soft); border-color: var(--flame-line); color: var(--text); font-weight: 600; }\n.seg.is-selected small { color: var(--flame); }\n\n.options { display: flex; flex-direction: column; gap: 6px; }\n.option {\n  display: flex;\n  align-items: center;\n  gap: 10px;\n  padding: 9px 12px;\n  border-radius: 12px;\n  background: var(--surface-2);\n  border: 1px solid transparent;\n}\n.opt-title { font-size: 13px; font-weight: 600; }\n.opt-desc { font-size: 11px; color: var(--text-2); margin-top: 2px; line-height: 1.35; }\n.opt-meta { margin-left: auto; font-size: 11px; font-weight: 600; color: var(--text-3); white-space: nowrap; }\n.option.is-selected { background: var(--flame-soft); border-color: var(--flame-line); }\n.option.is-selected .opt-meta { color: var(--flame); }\n\n.chips { display: flex; flex-wrap: wrap; gap: 6px; }\n.chip {\n  display: inline-flex;\n  align-items: center;\n  gap: 5px;\n  height: 30px;\n  padding: 0 10px;\n  border-radius: 99px;\n  background: var(--surface-2);\n  font-size: 12px;\n  font-weight: 500;\n  color: var(--text-2);\n}\n.chip.is-selected { background: var(--flame-soft); color: var(--text); box-shadow: inset 0 0 0 1px var(--flame-line); }\n.chip .i { width: 14px; height: 14px; }\n\n.c-flame { color: var(--flame); }\n.c-green { color: var(--green); }\n.c-violet { color: var(--violet); }\n.c-water { color: var(--water); }\n.c-muted { color: var(--text-2); }\n\n/* ---------- Cabeçalho interno do app (voltar + caminho) ---------- */\n.app-top {\n  flex-shrink: 0;\n  display: flex;\n  align-items: center;\n  gap: 10px;\n  padding: 12px 16px 0;\n  font-size: 12px;\n  color: var(--text-3);\n}\n.app-top .back {\n  width: 30px;\n  height: 30px;\n  border-radius: 10px;\n  background: var(--surface);\n  display: grid;\n  place-items: center;\n  color: var(--text);\n  flex-shrink: 0;\n}\n.app-top strong { color: var(--text-2); font-weight: 500; }\n\n/* ---------- Barra de abas inferior ---------- */\n.tabbar {\n  flex-shrink: 0;\n  display: flex;\n  justify-content: space-around;\n  padding: 10px 8px 18px;\n  border-top: 1px solid var(--line);\n}\n.tab { display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 10px; font-weight: 500; color: var(--text-3); }\n.tab .i { width: 20px; height: 20px; }\n.tab.active { color: var(--flame); }\n\n/* ---------- Indicador de toque (onde o usuário toca para ir à próxima tela) ---------- */\n.tap { position: relative; }\n.tap-dot {\n  position: absolute;\n  z-index: 2;\n  width: 26px;\n  height: 26px;\n  margin: -13px 0 0 -13px;\n  border-radius: 99px;\n  background: rgba(255, 255, 255, .22);\n  border: 2px solid rgba(255, 255, 255, .75);\n  pointer-events: none;\n}\n.tap-dot::after {\n  content: \"\";\n  position: absolute;\n  inset: -8px;\n  border-radius: inherit;\n  border: 2px solid rgba(255, 255, 255, .35);\n  animation: tap-pulse 1.8s ease-out infinite;\n}\n@keyframes tap-pulse {\n  from { transform: scale(.6); opacity: 1; }\n  to   { transform: scale(1.4); opacity: 0; }\n}\n\n/* ---------- Interruptor ---------- */\n.switch { width: 40px; height: 24px; border-radius: 99px; background: var(--surface-2); position: relative; flex-shrink: 0; }\n.switch::after { content: \"\"; position: absolute; top: 3px; left: 3px; width: 18px; height: 18px; border-radius: 99px; background: var(--text-3); }\n.switch.on { background: var(--flame); }\n.switch.on::after { left: 19px; background: #fff; }\n\n/* ---------- Botões secundários ---------- */\n.btn-dashed {\n  height: 44px;\n  flex-shrink: 0;\n  display: flex;\n  align-items: center;\n  justify-content: center;\n  gap: 8px;\n  border-radius: 12px;\n  border: 1.5px dashed var(--line-strong);\n  font-size: 13px;\n  font-weight: 600;\n  color: var(--text-2);\n}\n.btn-outline {\n  height: 36px;\n  flex: 1;\n  display: flex;\n  align-items: center;\n  justify-content: center;\n  gap: 6px;\n  border-radius: 10px;\n  background: var(--surface-2);\n  font-size: 13px;\n  font-weight: 600;\n}\n.btn-outline.primary { background: var(--flame); color: #fff; }\n\n/* ---------- Estado de campo em digitação ---------- */\n.input.is-focus { border-color: var(--flame); box-shadow: 0 0 0 3px var(--flame-soft); }\n.input.is-focus .value::after {\n  content: \"\";\n  display: inline-block;\n  width: 1.5px;\n  height: 15px;\n  margin-left: 2px;\n  vertical-align: -3px;\n  background: var(--flame);\n  animation: caret 1s steps(1) infinite;\n}\n@keyframes caret { 50% { opacity: 0; } }\n\n/* ---------- Hierarquia de botões ----------\n   .btn-primary   → 1 por tela: avança ou conclui o fluxo (sempre embaixo)\n   .btn-secondary → ação que continua na mesma tela (adicionar outro item, criar outro)\n   ------------------------------------------ */\n.btn-secondary {\n  height: 44px;\n  flex-shrink: 0;\n  display: flex;\n  align-items: center;\n  justify-content: center;\n  gap: 8px;\n  border-radius: 12px;\n  background: var(--surface);\n  border: 1px solid var(--line-strong);\n  font-size: 13px;\n  font-weight: 600;\n  color: var(--text);\n}\n\n/* ---------- Botão central \"+\" da barra de abas (registrar: check-in / refeição) ---------- */\n.tab-plus {\n  position: relative;\n  z-index: 6;\n  width: 48px;\n  height: 48px;\n  margin-top: -20px;\n  border-radius: 16px;\n  background: var(--flame);\n  color: #fff;\n  display: grid;\n  place-items: center;\n  box-shadow: 0 0 0 5px var(--app-bg);\n  flex-shrink: 0;\n}\n.tab-plus .i { width: 22px; height: 22px; stroke-width: 2.4; }\n.tab-plus.open { background: var(--surface-2); }\n\n/* ---------- Botão flutuante \"+\" (registros rápidos) ----------\n   Fica acima da barra de abas, no canto inferior direito, ao alcance do polegar.\n   Não aparece em telas que já têm um botão principal no rodapé. */\n.webapp-frame { position: relative; }\n.fab {\n  position: absolute;\n  right: 16px;\n  bottom: 84px;\n  z-index: 6;\n  width: 52px;\n  height: 52px;\n  border-radius: 18px;\n  background: var(--flame);\n  color: #fff;\n  display: grid;\n  place-items: center;\n  box-shadow: 0 12px 24px -8px rgba(255, 87, 34, .6), 0 0 0 4px var(--app-bg);\n}\n.fab .i { width: 22px; height: 22px; stroke-width: 2.4; }\n.fab.open { background: var(--surface-2); box-shadow: 0 0 0 4px var(--app-bg); }\n.has-fab .webapp-content { padding-bottom: 46px; }\n\n.url-bar .bf-fav { width: 14px; height: 14px; flex-shrink: 0; border-radius: 4px; }\n\n.deck-footer-nav { max-width: 1400px; margin: 40px auto 24px; padding: 14px 18px; display: flex; justify-content: center; border-top: 1px solid var(--line); }\n.deck-footer-nav .nav-arrows { gap: 12px; }\n\n/* Avisos de saúde */\n.health-note { display: flex; gap: 8px; align-items: flex-start; font-size: 10.5px; line-height: 1.45; color: var(--text-3); padding: 8px 10px; border-radius: 10px; background: var(--surface); border: 1px solid var(--line); }\n.health-note .i { width: 14px; height: 14px; flex-shrink: 0; margin-top: 1px; color: var(--text-2); }\n.health-note .lnk { color: var(--flame); font-weight: 600; white-space: nowrap; }\n.sug-note { margin-top: 10px; padding-top: 8px; border-top: 1px solid var(--line); font-size: 10.5px; line-height: 1.4; color: var(--text-3); }\n.consent { display: flex; gap: 8px; align-items: flex-start; font-size: 11px; line-height: 1.45; color: var(--text-2); }\n.consent b { color: var(--flame); font-weight: 600; }\n.consent .box { width: 16px; height: 16px; border-radius: 5px; background: var(--flame); color: #fff; display: grid; place-items: center; flex-shrink: 0; margin-top: 1px; }\n.consent .box .i { width: 11px; height: 11px; stroke-width: 3; }\n<\/style>\n  <style>\n    /* Particularidades do Módulo 5 */\n    .title-sm { font-size: 13px; font-weight: 600; }\n    .meta { font-size: 11px; color: var(--text-2); margin-top: 2px; }\n    .pill { font-size: 11px; font-weight: 600; padding: 3px 8px; border-radius: 99px; background: var(--flame-soft); color: var(--flame); white-space: nowrap; }\n    .stack { display: flex; flex-direction: column; gap: 8px; }\n    .num-lg { font-size: 26px; }\n    .meter { height: 6px; bord
