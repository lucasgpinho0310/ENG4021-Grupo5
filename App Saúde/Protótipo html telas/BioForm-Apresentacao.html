eight: 600; color: var(--text-2); background: var(--surface-2); padding: 2px 7px; border-radius: 99px; }\n    .tags em { font-style: normal; font-size: 11px; color: var(--text-3); margin-left: 2px; }\n    .chips-sel { display: flex; flex-wrap: wrap; gap: 6px; }\n    .chip-sel { display: inline-flex; align-items: center; gap: 4px; height: 30px; padding: 0 11px; border-radius: 99px; background: var(--surface-2); font-size: 12px; font-weight: 500; color: var(--text-2); }\n    .chip-sel.on { background: var(--flame-soft); color: var(--text); box-shadow: inset 0 0 0 1px var(--flame-line); font-weight: 600; }\n    .chip-sel .i { width: 12px; height: 12px; stroke-width: 3; color: var(--flame); }\n    .webapp-frame.has-sheet { position: relative; }\n    .sheet-backdrop { position: absolute; inset: 0; background: rgba(0,0,0,.55); z-index: 3; }\n    .quick-menu { position: absolute; left: 16px; right: 16px; bottom: 148px; z-index: 5; display: flex; flex-direction: column; gap: 8px; }\n    .quick-item { position: relative; display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-radius: 16px; background: var(--surface); border: 1px solid var(--line-strong); }\n    .quick-icon { width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center; color: #fff; flex-shrink: 0; }\n    .quick-icon .i { width: 20px; height: 20px; }\n  <\/style>\n<\/head>\n<body>\n\n  <svg width=\"0\" height=\"0\" style=\"position:absolute\">\n    <symbol id=\"i-info\" viewBox=\"0 0 24 24\"><circle cx=\"12\" cy=\"12\" r=\"10\"/><path d=\"M12 16v-4M12 8h.01\"/><\/symbol>\n    <symbol id=\"bf-logo\" viewBox=\"0 0 120 120\"><rect x=\"4\" y=\"4\" width=\"112\" height=\"112\" rx=\"32\" fill=\"#FF5722\"/><path d=\"M60 26a34 34 0 1 1-30.6 19.2\" stroke=\"#fff\" stroke-width=\"10\" stroke-linecap=\"round\" fill=\"none\"/><path d=\"M29.4 45.2 24 30l15.6 4.2\" stroke=\"#fff\" stroke-width=\"10\" stroke-linecap=\"round\" stroke-linejoin=\"round\" fill=\"none\"/><path d=\"M44 72l1 od-pill-link\">06. Diário<\/a>\n        <a href=\"07-grupos-desafios-gamificacao.html\" class=\"mod-pill-link\">07. Grupos & Desafios<\/a>\n        <a href=\"08-evolucao-insights.html\" class=\"mod-pill-link active\">08. Evolução & Insights<\/a>\n      <\/div>\n    <\/div>\n  <\/div>\n\n  <div class=\"header-section\">\n    <div class=\"badge-module\">Módulo 8 • Histórico, Padrões & Resultado<\/div>\n    <h1>Evolução: Calendários, Insights & Curva de Peso<\/h1>\n    <p>A <strong>Evolução<\/strong> é o lugar do histórico e da análise, com três abas. O <strong>Calendário<\/strong> mostra, com filtro Tudo | Treinos | Dieta, um ícone de treino (qualquer esporte) e um de dieta em cada dia, com a cor indicando a situação, e pergunta sobre dias incompletos. Em <strong>Insights<\/strong>, o app cruza por conta própria, sem IA, os registros de treino, dieta e diário: mostra descobertas (ex.: sono × dieta × treino), deixa o usuário <strong>explorar<\/strong> combinações (ex.: 2 treinos no dia + carbo alto → desempenho) navegando pelos dias encontrados, e revela padrões por dia da semana. Os insights só aparecem com dados suficientes; antes disso, o Início mostra apenas os contadores do dia. A aba <strong>Peso<\/strong> mostra a curva com as pesagens do Diário (o peso é sempre atualizado no Diário) e o objetivo atual. Ao <strong>atualizar o objetivo<\/strong>, nada é apagado: os gráficos e insights do objetivo anterior ficam congelados e podem ser consultados depois, enquanto o novo segue sendo atualizado. No calendário, um ícone indica treino (qualquer esporte) e outro indica a dieta.<\/p>\n  <\/div>\n\n  <div class=\"frames-container\">\n\n    <div>\n      <div class=\"frame-title\"><span>8A.<\/span>Calendário: Tudo (Treinos + Dieta)<\/div>\n      <div class=\"webapp-frame has-fab\">\n        <div class=\"url-bar\"><svg class=\"bf-fav\"><use href=\"#bf-logo\"/><\/svg><strong>app.bioform.io<\/strong>/evolucao/calendario<\/div>\n        <div class=\"app-top\"><span>Início<\/sp
